# Cargo config for Argos Engine - same machine toolchain as FlojoMCP.
# Machine (2026-09): VS 2026 BuildTools (18) MSVC 14.51.36231 + Windows SDK 10.0.26100.0.
# VS 2022 BuildTools no longer exists on this box; pin the current toolset.
# Only applies to the MSVC target; harmless on other hosts (LIB is ignored by unix toolchains).

[target.x86_64-pc-windows-msvc]
linker = "C:/Program Files (x86)/Microsoft Visual Studio/18/BuildTools/VC/Tools/MSVC/14.51.36231/bin/HostX64/x64/link.exe"

[env]
LIB = "C:/Program Files (x86)/Microsoft Visual Studio/18/BuildTools/VC/Tools/MSVC/14.51.36231/lib/x64;C:/Program Files (x86)/Windows Kits/10/lib/10.0.26100.0/ucrt/x64;C:/Program Files (x86)/Windows Kits/10/lib/10.0.26100.0/um/x64"
