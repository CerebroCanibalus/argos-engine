[package]
name = "argos-engine"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
license = "GPL-3.0-only"
description = "Token-efficient, local-first web research MCP server in Rust, backed by your own SearXNG"
repository = "https://github.com/CerebroCanibalus/argos-engine"
readme = "README.md"
keywords = ["mcp", "search", "searxng", "research", "metasearch"]
categories = ["command-line-utilities"]

[dependencies]
flojo-mcp = { git = "https://github.com/CerebroCanibalus/FlojoMCP" }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
schemars = "0.8"
thiserror = "2"
scraper = "0.24"
percent-encoding = "2"
base64 = "0.22"
futures = "0.3"
primp = "2.0"
url = "2"
reqwest = { version = "0.12", default-features = false, features = ["json", "native-tls"] }

[profile.release]
lto = "thin"
strip = true
